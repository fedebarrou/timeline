<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .apple { fill: #c0392b; }
    .leaf { fill: #2e8b57; }
    .stem { fill: #5a3a1e; }
    .shine { fill: #ffffff; opacity: 0.25; }
    @media (prefers-color-scheme: dark) {
      .apple { fill: #e85a4f; }
      .leaf { fill: #4caf6a; }
    }
  </style>
  <!-- Apple body: two-lobed silhouette -->
  <path class="apple" d="M32 22c-4-2-7-3-11-3-8 0-13 7-13 17 0 13 8 24 15 24 4 0 6-2 9-2s5 2 9 2c7 0 15-11 15-24 0-10-5-17-13-17-4 0-7 1-11 3z" />
  <!-- Stem -->
  <path class="stem" d="M32 22c-1-2-2-4-2-7l2 0c0 3 1 5 2 7z" />
  <!-- Leaf -->
  <path class="leaf" d="M32 18c2-5 7-8 13-8-1 7-6 11-13 11z" />
  <!-- Shine highlight -->
  <ellipse class="shine" cx="20" cy="32" rx="4" ry="7" transform="rotate(-25 20 32)" />
</svg>
