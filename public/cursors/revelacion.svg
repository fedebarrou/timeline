<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dx="0" dy="1" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- crescent + star, centered on (20,20) -->
  <g filter="url(#ds)" stroke="#2e2418" stroke-width="1" stroke-linejoin="round">
    <!-- crescent (large disc minus offset disc) -->
    <path d="M27 6 A14 14 0 1 0 27 34 A11 11 0 1 1 27 6 Z" fill="#8a6a3a"/>
    <!-- 5-point star to the right -->
    <polygon points="30,16 31.6,20 36,20 32.4,22.4 33.8,26.6 30,24.2 26.2,26.6 27.6,22.4 24,20 28.4,20"
             fill="#9a7840"/>
  </g>
  <!-- crosshair hotspot at center -->
  <circle cx="20" cy="20" r="1" fill="#2e2418"/>
</svg>
