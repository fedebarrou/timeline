<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dx="0" dy="1" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- flame-topped staff: vertical staff with flame at top, hotspot is mid -->
  <g filter="url(#ds)" stroke="#0c1622" stroke-width="1" stroke-linejoin="round">
    <!-- flame -->
    <path d="M20 4 C16 9, 16 13, 20 15 C24 13, 24 9, 20 4 Z" fill="#8aa8b8"/>
    <path d="M20 7 C18 10, 18 13, 20 14 C22 13, 22 10, 20 7 Z" fill="#5a8098"/>
    <!-- staff -->
    <rect x="18.6" y="14" width="2.8" height="22" rx="1" fill="#5a8098"/>
    <!-- grip ring at hotspot -->
    <rect x="16.5" y="19" width="7" height="2.6" rx="0.6" fill="#8aa8b8"/>
  </g>
  <!-- crosshair hotspot -->
  <circle cx="20" cy="20" r="1" fill="#0c1622"/>
</svg>
