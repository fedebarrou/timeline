<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6"/>
      <feOffset dx="0" dy="1" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Six-point star (Abraham): two overlaid triangles, half-scaled from the
       original 40x40 design. The hotspot (20,20) sits at the geometric centre,
       but now the star spans only ~10×16px around it instead of ~21×32px, so
       small map markers (8–16px) underneath the cursor stay visible and
       clickable. The intersection band of the two triangles is only 2px tall
       (y=19→21) — previously 4px — preventing the cursor from acting as an
       opaque cap over pins. Blur was also reduced (1.2 → 0.6) so the visual
       silhouette no longer bleeds beyond the geometry. -->
  <g filter="url(#ds)" stroke="#1f0d10" stroke-width="0.8" stroke-linejoin="round">
    <polygon points="20,12 25.2,21 14.8,21" fill="#a04048"/>
    <polygon points="20,28 14.8,19 25.2,19" fill="#b86058" fill-opacity="0.92"/>
    <circle cx="20" cy="20" r="1.6" fill="#b86058"/>
  </g>
  <!-- Crosshair hotspot marker, kept tiny so it doesn't reintroduce
       opacity over the click target. -->
  <circle cx="20" cy="20" r="0.8" fill="#1f0d10"/>
</svg>
