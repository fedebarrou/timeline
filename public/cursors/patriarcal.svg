<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dx="0" dy="1" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- six-point star (Abraham): two overlaid triangles -->
  <g filter="url(#ds)" stroke="#1f0d10" stroke-width="1" stroke-linejoin="round">
    <polygon points="20,4 30.4,22 9.6,22" fill="#a04048"/>
    <polygon points="20,36 9.6,18 30.4,18" fill="#b86058" fill-opacity="0.92"/>
    <circle cx="20" cy="20" r="2.8" fill="#b86058"/>
  </g>
  <!-- crosshair hotspot -->
  <circle cx="20" cy="20" r="1" fill="#1f0d10"/>
</svg>
