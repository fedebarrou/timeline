<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dx="0" dy="1" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- dove in flight, centered at body (20,20) -->
  <g filter="url(#ds)" stroke="#1f3625" stroke-width="1" stroke-linejoin="round">
    <!-- left wing -->
    <path d="M20 20 C12 12, 6 14, 4 22 C10 20, 14 22, 20 22 Z" fill="#a8d890"/>
    <!-- right wing -->
    <path d="M20 20 C28 12, 34 14, 36 22 C30 20, 26 22, 20 22 Z" fill="#a8d890"/>
    <!-- body + tail -->
    <ellipse cx="20" cy="22" rx="3.2" ry="5" fill="#f0e8a8"/>
    <path d="M20 27 L17 33 L20 31 L23 33 Z" fill="#a8d890"/>
    <!-- head + beak -->
    <circle cx="20" cy="15.5" r="2.4" fill="#f0e8a8"/>
    <path d="M22 15 L25 14 L22 16 Z" fill="#a8d890"/>
  </g>
  <!-- crosshair hotspot -->
  <circle cx="20" cy="20" r="1" fill="#1f3625"/>
</svg>
