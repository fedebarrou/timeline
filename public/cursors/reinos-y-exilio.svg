<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dx="0" dy="1" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- crown: 3-point with jewels, centered on (20,20) -->
  <g filter="url(#ds)" stroke="#1a0d1a" stroke-width="1" stroke-linejoin="round">
    <!-- crown peaks + base -->
    <path d="M6 30 L8 14 L14 22 L20 10 L26 22 L32 14 L34 30 Z" fill="#8a4a78"/>
    <!-- base band -->
    <rect x="6" y="28" width="28" height="6" rx="1" fill="#5e3052"/>
    <!-- jewels -->
    <circle cx="8" cy="14" r="1.6" fill="#a87858"/>
    <circle cx="20" cy="10" r="1.8" fill="#a87858"/>
    <circle cx="32" cy="14" r="1.6" fill="#a87858"/>
    <circle cx="20" cy="31" r="1.4" fill="#a87858"/>
  </g>
  <!-- crosshair hotspot at (20,20) -->
  <circle cx="20" cy="20" r="1" fill="#1a0d1a"/>
</svg>
